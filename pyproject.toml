[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brite-shopping-agent"
version = "0.1.0"
authors = [
    { name = "Brite Team", email = "team@example.com" },
]
description = "Agentic scraping and semantic search for Jamaican grocery catalogs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["scraping", "fastapi", "faiss", "grocery", "ollama"]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
