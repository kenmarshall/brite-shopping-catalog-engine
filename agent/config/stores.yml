- store_id: "grace-foods"
  store_name: "Grace Foods"
  base_url: "https://gracefoods.com"
  auth:
    strategy: none
    storage_state_path: "./data/sessions/grace-foods.json"
  navigation:
    start_paths:
      - "https://gracefoods.com/products"
    pagination:
      next_selector: ".noo_pagination li:not(.disabled) > a[title='Next']"
  selectors:
    product: ".noo_product"
    name: ".jshop_information .name"
    price: ".jshop_information .price"
    image: ".image_block img::attr(src)"
    size_hint: ".jshop_information .name"
    brand_hint: null
    category_hint: null
    location_hint: null
  rate_limits:
    rpm: 30
    concurrency: 2
