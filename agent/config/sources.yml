- source_id: "grace"
  entity_type: "brand"
  brand:
    name: "Grace"
  catalog_name: "Grace Foods"
  base_url: "https://gracefoods.com"
  defaults:
    brand: "Grace"
  auth:
    strategy: none
    storage_state_path: "./data/sessions/grace.json"
  navigation:
    start_paths:
      - "https://gracefoods.com/products"
    pagination:
      next_selector: ".noo_pagination li:not(.disabled) > a[title='Next']"
      max_pages: null
  selectors:
    product: ".noo_product"
    name: ".jshop_information .name"
    price: ".jshop_information .price"
    image: ".image_block img::attr(src)"
    size_hint: ".jshop_information .name"
    brand_hint: null
    category_hint: null
    location_hint: null
  rate_limits:
    rpm: 30
    concurrency: 2
