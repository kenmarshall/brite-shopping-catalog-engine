- source_id: "grace"
  entity_type: "brand"
  brand:
    name: "Grace"
  catalog_name: "Grace Foods"
  base_url: "https://gracefoods.com"
  defaults:
    brand: "Grace"
  auth:
    strategy: none
    storage_state_path: "./data/sessions/grace.json"
  navigation:
    start_paths:
      - "https://gracefoods.com/products"
    pagination:
      next_selector: ".noo_pagination li:not(.disabled) > a[title='Next']"
      max_pages: null
  selectors:
    product: ".noo_product"
    name: ".jshop_information .name"
    price: ".jshop_information .price"
    image: ".image_block img::attr(src)"
    size_hint: ".jshop_information .name"
    brand_hint: null
    category_hint: null
    location_hint: null
  rate_limits:
    rpm: 30
    concurrency: 2

- source_id: "sampars"
  entity_type: "store"
  store:
    name: "Sampars"
  catalog_name: "ShopSampars"
  base_url: "https://www.shopsampars.com"
  defaults:
    brand: null
    currency: "USD"
  auth:
    strategy: none
    storage_state_path: "./data/sessions/sampars.json"
  navigation:
    start_paths:
      - "https://www.shopsampars.com/shop/"
    pagination:
      next_selector: "a.next.page-numbers"
      max_pages: null
  selectors:
    product: ".products .product"
    name: ".wd-entities-title"
    price: ".woocommerce-Price-amount"
    image: "img::attr(data-lazy-src)"
    size_hint: ".wd-entities-title"
    brand_hint: null
    category_hint: ".wd-product-cats"
    location_hint: null
  rate_limits:
    rpm: 20
    concurrency: 2

