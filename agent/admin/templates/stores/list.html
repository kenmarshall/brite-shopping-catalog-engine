{% extends "base.html" %}
{% block content %}
<div class="mb-6 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h2 class="text-2xl font-bold">Stores</h2>
    <p class="mt-1 text-sm text-gray-500">Manage catalog sources used by the scraper pipeline.</p>
  </div>
</div>

{% if message %}
<div class="mb-4 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">{{ message }}</div>
{% endif %}
{% if error %}
<div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>
{% endif %}

<div class="mb-6 rounded-xl bg-white p-5 shadow">
  <h3 class="text-lg font-semibold">Add Store Source</h3>
  <p class="mt-1 text-sm text-gray-500">Creates a new source entry in <code>agent/config/sources.yml</code>.</p>
  <form
    id="stores-create-form"
    method="post"
    action="/admin/stores"
    class="mt-4 grid grid-cols-1 gap-4 lg:grid-cols-3 async-action-form"
    hx-post="/admin/stores"
    hx-swap="none"
  >
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Source ID</label>
      <input name="source_id" required placeholder="e.g. fontana" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Store Name</label>
      <input name="store_name" required placeholder="e.g. Fontana Pharmacy" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Base URL</label>
      <input name="base_url" required placeholder="https://example.com" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Scrape Strategy</label>
      <select name="strategy" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
        <option value="none">CSS selectors (public catalog)</option>
        <option value="playwright">Playwright/session-based</option>
        <option value="loccloud">LocCloud API</option>
        <option value="manual">Manual only (no scraper)</option>
      </select>
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Start Path</label>
      <input name="start_path" placeholder="https://example.com/shop/" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Currency</label>
      <input name="currency" value="JMD" maxlength="3" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm uppercase focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
    </div>
    <div class="lg:col-span-3">
      <button type="submit" class="inline-flex items-center rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white hover:bg-brand-dark" data-loading-text="Adding...">
        Add Store Source
      </button>
    </div>
  </form>
</div>

<div
  id="stores-table"
  class="overflow-x-auto rounded-xl bg-white shadow"
  hx-get="/admin/stores/sections/table"
  hx-trigger="load, admin:stores-refresh from:body"
  hx-swap="innerHTML"
>
  <div class="p-6 text-sm text-gray-500 animate-pulse">Loading stores...</div>
</div>
{% endblock %}
