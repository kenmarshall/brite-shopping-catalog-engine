<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title | default("Admin") }} - Brite Shopping Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#0a7ea4', light: '#4dc9f6', dark: '#07556f' },
            panel: '#f5f8fa',
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-full bg-panel text-gray-900 antialiased">
  <div class="min-h-screen md:flex">
    <aside class="hidden md:flex w-48 flex-col bg-gray-900 text-gray-300">
      <div class="px-5 py-5 border-b border-gray-700">
        <h1 class="text-lg font-bold text-white">Brite Admin</h1>
        <p class="text-xs text-gray-500 mt-1">Catalog Engine</p>
      </div>
      <nav class="flex-1 py-4 space-y-1">
        <a href="/admin/" class="admin-nav-link {% if active_nav == 'dashboard' %}admin-nav-link-active{% endif %}">
          <span class="mr-2">&#9632;</span> Dashboard
        </a>
        <a href="/admin/products" class="admin-nav-link {% if active_nav == 'products' %}admin-nav-link-active{% endif %}">
          <span class="mr-2">&#9642;</span> Products
        </a>
        <a href="/admin/stores" class="admin-nav-link {% if active_nav == 'stores' %}admin-nav-link-active{% endif %}">
          <span class="mr-2">&#9643;</span> Stores
        </a>
        <a href="/admin/scrapes" class="admin-nav-link {% if active_nav == 'scrapes' %}admin-nav-link-active{% endif %}">
          <span class="mr-2">&#9654;</span> Scrapes
        </a>
        <a href="/admin/curator" class="admin-nav-link {% if active_nav == 'curator' %}admin-nav-link-active{% endif %}">
          <span class="mr-2">&#10024;</span> AI Curator
        </a>
      </nav>
      <div class="px-5 py-3 border-t border-gray-700">
        <div
          class="flex items-center text-xs"
          hx-get="/admin/db-status"
          hx-trigger="load, every 30s"
          hx-swap="innerHTML"
        >
          <span class="inline-block w-2 h-2 rounded-full bg-gray-500 mr-1.5 animate-pulse"></span>
          <span class="text-gray-500">Checking...</span>
        </div>
        <div class="mt-1 text-xs text-gray-500">Local Admin Console</div>
      </div>
    </aside>

    <div class="flex-1 min-w-0">
      <header class="md:hidden sticky top-0 z-10 bg-gray-900 text-white border-b border-gray-700">
        <div class="px-4 py-3">
          <div class="text-sm font-semibold">Brite Admin</div>
          <div class="mt-2 flex gap-2 overflow-x-auto text-xs pb-1">
            <a href="/admin/" class="admin-mobile-link {% if active_nav == 'dashboard' %}admin-mobile-link-active{% endif %}">Dashboard</a>
            <a href="/admin/products" class="admin-mobile-link {% if active_nav == 'products' %}admin-mobile-link-active{% endif %}">Products</a>
            <a href="/admin/stores" class="admin-mobile-link {% if active_nav == 'stores' %}admin-mobile-link-active{% endif %}">Stores</a>
            <a href="/admin/scrapes" class="admin-mobile-link {% if active_nav == 'scrapes' %}admin-mobile-link-active{% endif %}">Scrapes</a>
            <a href="/admin/curator" class="admin-mobile-link {% if active_nav == 'curator' %}admin-mobile-link-active{% endif %}">Curator</a>
          </div>
        </div>
      </header>

      <main class="px-4 py-5 md:px-8 md:py-7">
        <div id="admin-flash" class="mb-4 hidden"></div>
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script>
    (() => {
      const flash = document.getElementById('admin-flash');
      let flashTimer = null;

      const detailValue = (event) => {
        if (!event || !event.detail) {
          return null;
        }
        if (event.detail.value && typeof event.detail.value === 'object') {
          return event.detail.value;
        }
        if (typeof event.detail === 'object') {
          return event.detail;
        }
        return null;
      };

      const showFlash = (level, message) => {
        if (!flash || !message) {
          return;
        }
        const tone = level === 'error'
          ? 'border-red-200 bg-red-50 text-red-700'
          : 'border-green-200 bg-green-50 text-green-700';
        flash.className = `mb-4 rounded-lg border px-4 py-3 text-sm ${tone}`;
        flash.textContent = message;
        flash.classList.remove('hidden');
        if (flashTimer) {
          window.clearTimeout(flashTimer);
        }
        flashTimer = window.setTimeout(() => {
          flash.classList.add('hidden');
          flash.textContent = '';
        }, 5000);
      };

      const findAsyncForm = (target) => (
        target instanceof HTMLElement
          ? target.closest('form.async-action-form, form.curator-action-form')
          : null
      );

      const setButtonLoading = (form, submitter) => {
        if (!submitter || !(submitter instanceof HTMLElement)) {
          return;
        }
        if (submitter.dataset.loadingActive === '1') {
          return;
        }
        submitter.dataset.loadingActive = '1';
        submitter.dataset.originalText = submitter.textContent || '';
        submitter.textContent = submitter.dataset.loadingText || 'Working...';
        submitter.disabled = true;
        submitter.classList.add('opacity-70', 'cursor-not-allowed');
        form.dataset.loadingButton = submitter.name || submitter.id || '__active__';
      };

      const resetButtonLoading = (form) => {
        if (!form || !(form instanceof HTMLElement)) {
          return;
        }
        const active = form.querySelector('button[data-loading-active="1"]');
        if (!active) {
          return;
        }
        active.textContent = active.dataset.originalText || active.textContent || '';
        active.disabled = false;
        active.classList.remove('opacity-70', 'cursor-not-allowed');
        delete active.dataset.loadingActive;
      };

      document.body.addEventListener('submit', (event) => {
        const form = findAsyncForm(event.target);
        if (!form) {
          return;
        }
        const submitter = event.submitter || form.querySelector('button[type="submit"]');
        if (submitter && submitter.dataset.loadingActive === '1') {
          event.preventDefault();
          return;
        }
        setButtonLoading(form, submitter);
      });

      document.body.addEventListener('htmx:afterRequest', (event) => {
        const form = findAsyncForm(event.target);
        if (!form) {
          return;
        }
        resetButtonLoading(form);
      });

      document.body.addEventListener('htmx:responseError', (event) => {
        const form = findAsyncForm(event.target);
        if (!form) {
          return;
        }
        resetButtonLoading(form);
      });

      document.body.addEventListener('admin:notify', (event) => {
        const payload = detailValue(event);
        if (!payload) {
          return;
        }
        showFlash(payload.level || 'success', payload.message || '');
      });

      document.body.addEventListener('admin:reset-form', (event) => {
        const payload = detailValue(event);
        const formId = payload && payload.id ? String(payload.id) : '';
        if (!formId) {
          return;
        }
        const form = document.getElementById(formId);
        if (form && form instanceof HTMLFormElement) {
          form.reset();
        }
      });
    })();
  </script>
</body>
</html>
