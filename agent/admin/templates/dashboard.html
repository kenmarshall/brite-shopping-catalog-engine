{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Dashboard</h2>

<div
  id="dashboard-stats"
  class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8"
  hx-get="/admin/dashboard/sections/stats"
  hx-trigger="load, admin:dashboard-refresh from:body"
  hx-swap="innerHTML"
>
  <div class="bg-white rounded-lg shadow p-5 animate-pulse">
    <div class="h-4 w-24 rounded bg-gray-200"></div>
    <div class="mt-3 h-8 w-20 rounded bg-gray-200"></div>
  </div>
  <div class="bg-white rounded-lg shadow p-5 animate-pulse">
    <div class="h-4 w-24 rounded bg-gray-200"></div>
    <div class="mt-3 h-8 w-20 rounded bg-gray-200"></div>
  </div>
  <div class="bg-white rounded-lg shadow p-5 animate-pulse">
    <div class="h-4 w-24 rounded bg-gray-200"></div>
    <div class="mt-3 h-8 w-20 rounded bg-gray-200"></div>
  </div>
</div>

<div class="mb-8 flex flex-wrap gap-3">
  <a href="/admin/products/new" class="inline-flex items-center rounded-lg bg-brand px-4 py-2 text-sm font-medium text-white hover:bg-brand-dark">
    Add Product
  </a>
  <a href="/admin/scrapes" class="inline-flex items-center rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
    Manage Scrapes
  </a>
  <a href="/admin/stores" class="inline-flex items-center rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
    Manage Stores
  </a>
</div>

<div
  id="dashboard-store-stats"
  class="bg-white rounded-lg shadow mb-8"
  hx-get="/admin/dashboard/sections/store-stats"
  hx-trigger="load, admin:dashboard-refresh from:body"
  hx-swap="innerHTML"
>
  <div class="p-6 text-sm text-gray-500 animate-pulse">Loading store stats...</div>
</div>

<div
  id="dashboard-recent-jobs"
  class="bg-white rounded-lg shadow"
  hx-get="/admin/dashboard/sections/recent-jobs"
  hx-trigger="load, admin:dashboard-refresh from:body"
  hx-swap="innerHTML"
>
  <div class="p-6 text-sm text-gray-500 animate-pulse">Loading recent jobs...</div>
</div>
{% endblock %}
