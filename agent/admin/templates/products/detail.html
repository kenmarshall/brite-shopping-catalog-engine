{% extends "base.html" %}
{% block content %}
{% if message %}
<div class="mb-4 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">{{ message }}</div>
{% endif %}
{% if error %}
<div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>
{% endif %}

<div
  id="product-detail-content"
  hx-get="/admin/products/{{ product._id }}/section/content"
  hx-trigger="load, admin:product-detail-refresh from:body"
  hx-swap="innerHTML"
>
  {% include "products/_detail_content.html" %}
</div>
{% endblock %}
